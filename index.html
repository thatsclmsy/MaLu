<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>MaLu – Für dich ❤️</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eine kleine, liebevoll animierte Seite – nur für dich. ❤️" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050816;
      --accent: #ff6fb5;
      --accent-soft: #ff9fd0;
      --text: #f5f5f5;
      --muted: #b0b3c5;
      --card: #111827;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Montserrat", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #050816 45%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(16px);
      background: rgba(5, 8, 22, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #fff 0, #ff6fb5 35%, #7c3aed 100%);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Dancing Script", cursive;
      font-size: 1.2rem;
      color: #050816;
    }

    .nav-title {
      display: flex;
      flex-direction: column;
      margin-left: 0.6rem;
    }

    .nav-title-main {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .nav-title-sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      gap: 1.2rem;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      position: relative;
    }

    .nav-link:hover {
      color: var(--text);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    /* Layout */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2rem 1.2rem 3rem;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 2rem;
      align-items: center;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      header { position: static; }
      .nav { flex-direction: column; align-items: flex-start; }
    }

    /* Hero */
    .hero {
      padding: 1.6rem;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .hero-title {
      font-family: "Dancing Script", cursive;
      font-size: 2.4rem;
      color: var(--accent-soft);
      margin-bottom: 0.4rem;
    }

    .hero-text {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.4rem;
    }

    .btn {
      border-radius: 999px;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      margin-right: 0.6rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #050816;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    /* Ebby Animation */
    .visual-card {
      padding: 1.4rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #1f2937 0, #050816 60%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(148, 163, 184, 0.25);
      text-align: center;
    }

    .ebby-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .ebby {
      width: 58%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #fff 0, #ffe4f3 25%, #ff6fb5 55%, #7c3aed 100%);
      animation: float 4s ease-in-out infinite, wiggle 1.5s ease-in-out infinite;
      box-shadow:
        0 0 40px rgba(255, 111, 181, 0.8),
        0 0 80px rgba(124, 58, 237, 0.6);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }

    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <nav class="nav">
      <div style="display:flex;align-items:center;">
        <div class="logo-circle">M</div>
        <div class="nav-title">
          <span class="nav-title-main">MaLu</span>
          <span class="nav-title-sub">Nur für dich ❤️</span>
        </div>
      </div>

      <div class="nav-links">
        <a class="nav-link" href="#home">Home</a>
        <a class="nav-link" href="blog.html">Blog</a>
        <a class="nav-link" href="#gallery">Galerie</a>
        <a class="nav-link" href="#contact">Kontakt</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <section class="hero" id="home">
        <h1 class="hero-title">Für dich, MaLu ❤️</h1>
        <p class="hero-text">
          Diese Seite ist nur für dich.  
          Ich kann sie jederzeit erweitern – mit Bildern, Blog‑Einträgen, kleinen Nachrichten.
        </p>

        <button class="btn btn-primary" onclick="location.href='blog.html'">Zum Blog</button>
      </section>

      <section class="visual-card">
        <div class="ebby-wrapper">
          <div class="ebby"></div>
        </div>
        <p>Ebby passt auf diese kleine Ecke des Internets auf – und auf dich.</p>
      </section>
    </div>
  </main>

  <footer>
    Mit ❤️ gebaut – und jederzeit erweiterbar.
  </footer>
</body>
</html>
