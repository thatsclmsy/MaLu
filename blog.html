<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Blog – MaLu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: #050816;
      color: #f5f5f5;
      font-family: "Montserrat", sans-serif;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #ff6fb5;
    }

    .post-list {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .post-card {
      background: #111827;
      padding: 1.4rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.2s;
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: #ff6fb5;
    }

    .post-card a {
      color: #ff9fd0;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .post-date {
      font-size: 0.8rem;
      color: #b0b3c5;
      margin-top: 0.3rem;
    }
  </style>
</head>

<body>
  <h1>Blog</h1>

  <div class="post-list">
    <div class="post-card">
      <a href="blog-eintrag1.html">Mein erster Blogeintrag</a>
      <div class="post-date">23. August 2026</div>
    </div>
  </div>
</body>
</html>
